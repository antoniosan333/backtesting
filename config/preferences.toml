[defaults]
data_adapter = "yfinance"
options_chain_source = "yfinance"
starting_capital = 100000
commission_per_contract = 0.65
stock_commission_per_order = 0.0
stock_commission_per_share = 0.0
slippage_bps = 2
timezone = "America/New_York"

[paths]
data_dir = "data"
strategies_dir = "strategies"
runs_dir = "runs"

[reporting]
plot_theme = "plotly_dark"
save_html = true

[risk]
max_position_pct = 0.1
max_open_positions = 5

[optionsdx]
input_dir = "zRawData/optionsdx"
output_dir = "data/optionsdx/normalized"
reports_dir = "data/optionsdx/reports"

[expected_move]
skew_factor = 0.85
max_spread_pct = 0.5
horizons_dte = [0, 7, 30]

[volatility]
hv_windows = [10, 20, 30, 60, 252]
iv_targets_dte = [7, 30, 60, 90]
lookback_days = 252
max_strike_distance_pct = 0.15
pre_days = 30
post_days = 10
history_start = "2019-01-01"
