[project]
name = "lambdaclass"
version = "0.1.0"
description = "Stock and options strategy backtesting toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.3",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pyarrow>=18.0.0",
  "pydantic>=2.9.0",
  "vollib>=1.0.1",
  "streamlit>=1.40",
  "typer>=0.12.5",
  "yfinance>=0.2.43",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1",
  "pandas-stubs>=3.0.5.260914",
  "pytest>=8.3.0",
  "ruff>=0.16.9",
]

[project.scripts]
lambdaclass = "lambdaclass.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
